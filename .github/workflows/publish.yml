name: Publish

# Publishes @cedarjs/pg to npm. Not run automatically on push;
# trigger via GitHub Release or workflow_dispatch when ready.
#
# Auth: npm Trusted Publisher (OIDC). Configure the GitHub Actions
# publisher for @cedarjs/pg on npmjs.com. Do not set NPM_TOKEN.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag"
        required: true
        default: "alpha"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true

      - run: vp check
      - run: vp test
      - run: vp run smoke

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          scope: "@cedarjs"

      - name: Publish to npm
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            if [[ "$VERSION" == *-* ]]; then
              TAG="alpha"
            else
              TAG="latest"
            fi
          fi
          npm publish --access public --tag "$TAG" --provenance
