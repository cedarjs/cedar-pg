name: Publish

# Stages @cedarjs/pg on npm. Not run automatically on push;
# trigger via GitHub Release or workflow_dispatch when ready.
#
# Auth: npm Trusted Publisher (OIDC). Configure the GitHub Actions
# publisher for @cedarjs/pg on npmjs.com with allowed action
# "npm stage publish" only. Do not set NPM_TOKEN.
# After CI stages the package, a maintainer approves from a trusted
# device (2FA): vp pm stage approve <stage-id>
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (empty = from package.json: alpha/beta/rc/… or latest)"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true

      - run: vp check
      - run: vp test
      - run: vp run smoke

      - name: Stage publish to npm
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          CONFIG_TAG="$(node -p "require('./package.json').publishConfig?.tag ?? 'latest'")"
          # 0.2.0-beta.0 → beta; 1.0.0-rc.1 → rc; 1.0.0 → latest
          DERIVED_TAG="$(node -p 'const pre = require("./package.json").version.split("-")[1]; pre ? pre.split(".")[0] : "latest"')"

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$DERIVED_TAG"
            if [[ "$CONFIG_TAG" != "$DERIVED_TAG" ]]; then
              echo "publishConfig.tag ($CONFIG_TAG) != derived tag ($DERIVED_TAG) from $VERSION" >&2
              exit 1
            fi
          fi

          if [[ "$VERSION" == *-* && "$TAG" == "latest" ]]; then
            echo "refusing to publish prerelease $VERSION as dist-tag latest" >&2
            exit 1
          fi

          echo "Staging $VERSION with npm dist-tag $TAG"
          vp pm stage publish --access public --tag "$TAG" --provenance
