name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/autopg
            ~/.local/bin/autopg
          key: autopg-v3.0.7-${{ runner.os }}

      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Binary only (no pm2). install.sh attestation needs a token on Actions.
      - name: Install autopg binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOPG_VERSION: v3.0.7
        run: bash scripts/ci-install-autopg.sh

      - run: vp check
      - run: vp test
      - run: vp run smoke
      - run: vp run smoke:pg
        env:
          CEDAR_PG_INSTALL_AUTOPG: "1"
