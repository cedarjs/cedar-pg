name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true

      - uses: ./.github/actions/setup-autopg

      - run: vp check
      - run: vp test
      - run: vp run smoke
      - run: vp run smoke:pg
