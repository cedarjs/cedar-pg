name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true

      - id: autopg
        run: echo "version=$(tr -d '[:space:]' < scripts/autopg-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/autopg
            ~/.local/bin/autopg
          key: autopg-${{ steps.autopg.outputs.version }}-${{ runner.os }}

      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Binary only (no pm2). Attestation verify needs GH_TOKEN on Actions.
      - name: Install autopg binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-install-autopg.sh

      - run: vp check
      - run: vp test
      - run: vp run smoke
      - run: vp run smoke:pg
